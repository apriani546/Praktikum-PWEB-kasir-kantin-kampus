<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Kantin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="bg-primary text-white text-center p-3">
    <h2>Kasir Kantin Kampus</h2>
</header>

<nav class="navbar bg-light">
    <div class="container">
        <span class="navbar-brand">Kantin Kampus</span>
    </div>
</nav>

<main class="container my-4">
    <section class="card p-3">
        <h4>Pesan Makanan</h4>

        <form id="form">
            <select id="menu" class="form-select mb-2">
                <option value="">Pilih Menu </option>
                <option value="Nasi Goreng">Nasi Goreng  Rp10.000</option>
                <option value="Lalapan">Lalapan Rp15.000</option>
                <option value="Es Teh">Es Teh Rp5.000</option>
            </select>

            <input type="number" id="jumlah"
                class="form-control mb-2"
                placeholder="Jumlah"
                min="0">

            <button class="btn btn-primary">Tambah</button>
        </form>
    </section>

    <section class="card p-3 mt-3">
        <h4>Pesanan</h4>

        <table class="table">
            <thead>
                <tr>
                    <th>Menu</th>
                    <th>Jumlah</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody id="tabel"></tbody>
        </table>

        <h5>Total: Rp <span id="total">0</span></h5>

        <input type="number" id="bayar"
            class="form-control mb-2"
            placeholder="Bayar"
            min="0">

        <button id="hitung" class="btn btn-success">
            Hitung Kembalian
        </button>

        <div id="hasil" class="alert alert-info mt-3">
            Kembalian: Rp 0
        </div>
    </section>

</main>
<footer class="text-center p-3">
    <small>Kasir Kantin Kampus</small>
</footer>
<script src="script.js"></script>
</body>
</html>
